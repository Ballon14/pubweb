; PHP Configuration untuk mengatasi timeout issues
max_execution_time = 300
memory_limit = 512M
max_input_time = 300
max_input_vars = 3000
post_max_size = 64M
upload_max_filesize = 64M

; Disable problematic extensions yang bisa menyebabkan timeout
; extension=mbstring
; extension=iconv

; Error reporting
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On
log_errors = On

; OPcache settings
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
